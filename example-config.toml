# Ghost configuration. Every key under [settings] is optional and falls back to
# the value shown here, so you can delete anything you don't want to override.
#
# Location: ~/.config/ghost/config.toml  (Linux/macOS)
#           %APPDATA%\ghost\config.toml  (Windows)
#
# Ghost rewrites this file when you add, edit, or delete a server in the TUI.

[settings]
# One of: TokyoNightDark, TokyoNightLight, DraculaDark, GruvboxDark,
# GruvboxLight, NordDark, SolarizedDark, SolarizedLight, MonokaiDark,
# CatppuccinDark, OneDark, Ayu
theme = "TokyoNightDark"
# Seconds between background reachability checks.
refresh_interval = 30
show_only_online = false
show_tooltips = true
panel_layout = "three"        # single | two | three

# Each [servers.<key>] block is one connection. The key is the internal id;
# name it whatever you like. auth_method.type is one of:
#   agent | public_key | password | interactive
[servers.production_web]
name = "Production Web Server"
host = "prod.example.com"
port = 22
username = "deploy"
description = "Main production web server"
tags = ["production", "web", "critical"]
# ssh ConnectTimeout in seconds; omit to use the default (10).
timeout = 10

[servers.production_web.auth_method]
type = "public_key"
key_path = "~/.ssh/id_ed25519"

[servers.dev_local]
name = "Development Box"
host = "dev.local"
port = 22
username = "developer"
description = "Local development environment"
tags = ["development", "local"]
timeout = 5

[servers.dev_local.auth_method]
type = "agent"

[servers.database_primary]
name = "Database Primary"
host = "db-primary.example.com"
port = 22
username = "dbadmin"
description = "Primary database server"
tags = ["database", "production", "primary"]
timeout = 15

[servers.database_primary.auth_method]
type = "public_key"
key_path = "~/.ssh/db_key"

[servers.staging]
name = "Staging Server"
host = "staging.example.com"
port = 2222
username = "staging"
description = "Staging environment for testing"
tags = ["staging", "testing"]
timeout = 8

[servers.staging.auth_method]
type = "interactive"