[package]
name = "ghost-ssh"
version = "0.2.0"
edition = "2021"
description = "A terminal SSH connection manager: keep your hosts in one list, see which are reachable, and connect in one keystroke"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Smoke516/ghost"
homepage = "https://github.com/Smoke516/ghost"
documentation = "https://docs.rs/ghost-ssh"
keywords = ["ssh", "terminal", "tui", "connection-manager", "sysadmin"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["screenshots/", "docs/", ".github/", "target/", "*.log"]
rust-version = "1.88"  # highest floor in the locked graph (instability, home, darling)

[[bin]]
name = "ghost"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
dirs = "5.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
shellexpand = "3.1"
which = "4.4"
futures = "0.3"
unicode-width = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
